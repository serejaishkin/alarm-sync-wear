name: Fix duplicate Russian string

on:
  push:
    branches:
      - develop/wakesync

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate settings_12_hour
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/res/values-ru/strings.xml')
          s = p.read_text(encoding='utf-8')
          needle = '    <string name="settings_12_hour">'
          lines = s.splitlines(keepends=True)
          seen = 0
          out = []
          for line in lines:
              if line.startswith(needle):
                  seen += 1
                  if seen > 1:
                      continue
              out.append(line)
          p.write_text(''.join(out), encoding='utf-8')
          if seen != 2:
              raise SystemExit(f'Expected exactly 2 settings_12_hour entries, found {seen}')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/res/values-ru/strings.xml
          if git diff --cached --quiet; then
            echo 'No change needed'
            exit 0
          fi
          git commit -m 'fix(build): remove duplicate settings_12_hour'
          git push origin HEAD:develop/wakesync
